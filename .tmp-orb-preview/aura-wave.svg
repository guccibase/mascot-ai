rise" transform="translate(268,118) scale(0.85)" fill="#7A62B0" style="animation-delay:.7s" d="M0,-9 L2.4,-2.4 L9,0 L2.4,2.4 L0,9 L-2.4,2.4 L-9,0 L-2.4,-2.4 Z"></path><circle cx="248" cy="196" r="4" fill="#FFF6DE" class="ob-twinkle"></circle></g></g></svg>