<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="100%" role="img" aria-labelledby="ln-title-idle ln-description-idle" class="ln-svg ln-g-idle " style="--g:0.45;cursor:pointer"><title id="ln-title-idle">Shade — Idle</title><desc id="ln-description-idle">Soft bob and blink while his LED pupils follow your cursor.</desc><style>
  .ln-svg{display:block;user-select:none;-webkit-user-select:none;--gf:1}
  .ln-g-alarm{--gf:1.75}
  .ln-g-celebrate{--gf:1.4}
  .ln-g-success{--gf:1.35}
  .ln-g-flying{--gf:1.5}
  .ln-g-proud{--gf:1.3}
  .ln-g-love{--gf:1.25}
  .ln-g-grumpy{--gf:.7}
  .ln-g-sad{--gf:.6}
  .ln-g-crying{--gf:.5}
  .ln-g-sleepy{--gf:.42}
  .ln-g-empty{--gf:.55}
  .ln-float{animation:ln-float 3.7s ease-in-out infinite}
  .ln-g-sleepy .ln-float{animation-duration:6s}
  .ln-g-alarm .ln-float{animation:none}
  .ln-g-celebrate .ln-float{animation-duration:1.85s}
  .ln-g-dancing .ln-float{animation-duration:1.4s}
  .ln-g-running .ln-float{animation:ln-runBounce .28s ease-in-out infinite}
  .ln-g-flying .ln-float{animation:ln-soar 1.6s ease-in-out infinite}
  .ln-shadowO{animation:ln-shadowO 3.7s ease-in-out infinite}
  .ln-g-running .ln-shadowO{animation:ln-runShadow .28s ease-in-out infinite}
  .ln-g-flying .ln-shadowO{opacity:.1;animation:none;transform:scaleX(.72)}
  .ln-glow{animation:ln-glow 3.1s ease-in-out infinite}
  .ln-g-alarm .ln-glow{animation-duration:.85s}
  .ln-wave-on .ln-glow{animation-duration:1.5s}
  .ln-pop{animation:ln-pop .28s ease-out}
  .ln-pupils{transition:transform .12s ease-out}
  .ln-ring{animation:ln-ring 1.15s ease-out infinite}
  .ln-scan{animation:ln-scan 2.4s ease-in-out infinite}
  .ln-zzz{animation:ln-zzz 3.2s ease-in-out infinite}
  .ln-rise{animation:ln-rise 2.5s ease-out infinite}
  .ln-fall{animation:ln-fall 2.8s linear infinite}
  .ln-twinkle{animation:ln-twinkle 1.4s ease-in-out infinite}
  .ln-tear{animation:ln-tear 2.8s ease-in infinite}
  .ln-eq{animation:ln-eq 1s ease-in-out infinite}
  .ln-type{animation:ln-type .52s steps(2) infinite}
  .ln-dot{animation:ln-dot 1.2s ease-in-out infinite}
  .ln-smoke{animation:ln-smoke 1.9s ease-out infinite}
  .ln-streak{animation:ln-streak .7s linear infinite}
  .ln-whoosh{animation:ln-whoosh .28s linear infinite}
  .ln-dust{animation:ln-dust .48s ease-out infinite}
  .ln-svg[data-paused] *{animation-play-state:paused!important}
  @keyframes ln-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes ln-soar{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
  @keyframes ln-runBounce{0%,100%{transform:translate(10px,4px)}25%{transform:translate(-4px,-14px)}50%{transform:translate(12px,2px)}75%{transform:translate(-2px,-16px)}}
  @keyframes ln-runShadow{0%,100%{opacity:.28;transform:translateX(-16px) scaleX(1.25)}50%{opacity:.12;transform:translateX(10px) scaleX(.65)}}
  @keyframes ln-shadowO{0%,100%{opacity:.22}50%{opacity:.12}}
  @keyframes ln-whoosh{0%{transform:translateX(18px);opacity:0}28%{opacity:.95}100%{transform:translateX(-56px);opacity:0}}
  @keyframes ln-dust{0%{transform:translate(0,0) scale(1);opacity:0}18%{opacity:.75}100%{transform:translate(-40px,8px) scale(.6);opacity:0}}
  @keyframes ln-glow{0%,100%{opacity:calc(var(--g,.45)*var(--gf,1)*.5)}50%{opacity:calc(var(--g,.45)*var(--gf,1))}}
  @keyframes ln-pop{from{opacity:0}to{opacity:1}}
  @keyframes ln-ring{0%,74%,100%{opacity:0}18%{opacity:.95}55%{opacity:0}}
  @keyframes ln-scan{0%,100%{opacity:.1;transform:translateY(-2px)}50%{opacity:.5;transform:translateY(74px)}}
  @keyframes ln-zzz{0%{opacity:0;transform:translate(0,8px)}25%{opacity:.95}72%{opacity:.5}100%{opacity:0;transform:translate(12px,-26px)}}
  @keyframes ln-rise{0%{opacity:.42;transform:translateY(10px)}24%{opacity:1}100%{opacity:0;transform:translateY(-42px)}}
  @keyframes ln-fall{0%{opacity:.3;transform:translateY(-20px)}12%{opacity:1}84%{opacity:.9}100%{opacity:.2;transform:translateY(145px)}}
  @keyframes ln-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ln-tear{0%{opacity:0;transform:translateY(0)}16%{opacity:1}82%{opacity:.85}100%{opacity:0;transform:translateY(46px)}}
  @keyframes ln-eq{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes ln-type{0%,100%{opacity:1}50%{opacity:.2}}
  @keyframes ln-dot{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ln-smoke{0%{opacity:0;transform:translate(0,0) scale(.7)}20%{opacity:.55}100%{opacity:0;transform:translate(0,48px) scale(1.3)}}
  @keyframes ln-streak{0%{opacity:0;transform:translate(0,0)}28%{opacity:.85}100%{opacity:0;transform:translate(0,36px)}}
  @media (prefers-reduced-motion:reduce){.ln-svg *{animation:none!important;transition:none!important}}
</style><defs><radialGradient id="ln-glow-idle" cx="50%" cy="46%" r="58%"><stop offset="0" stop-color="#eae6fe" stop-opacity=".95"></stop><stop offset="1" stop-color="#eae6fe" stop-opacity="0"></stop></radialGradient><linearGradient id="ln-body-idle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#afa5e2"></stop><stop offset="1" stop-color="#9B8CDB"></stop></linearGradient><linearGradient id="ln-screen-idle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46435a"></stop><stop offset="1" stop-color="#2A2440"></stop></linearGradient></defs><ellipse data-ms-part="shadow" class="ln-shadowO" cx="210" cy="498" rx="88" ry="9" fill="#000" opacity=".2"></ellipse><g class="ln-float" transform="translate(0,0)"><g transform="translate(210,470)"><animateTransform attributeName="transform" type="translate" additive="sum" begin="ln-hit.click" dur="0.6s" fill="remove" values="0 0;0 7;0 -12;0 3;0 0" keyTimes="0;0.24;0.54;0.8;1"></animateTransform><animateTransform attributeName="transform" type="scale" additive="sum" begin="ln-hit.click" dur="0.6s" fill="remove" values="1 1;1.05 .93;.97 1.05;1.02 .98;1 1" keyTimes="0;0.24;0.54;0.8;1"></animateTransform><g transform="rotate(0)"><g transform="translate(-210,-470)"><g id="ln-hit"><ellipse data-ms-part="halo" class="ln-glow ms-glow-halo" cx="210" cy="280" rx="140" ry="124" fill="url(#ln-glow-idle)"></ellipse><g data-ms-part="base"><ellipse cx="210" cy="448" rx="74" ry="18" fill="#726aa4"></ellipse><ellipse cx="210" cy="440" rx="60" ry="14" fill="#9B8CDB"></ellipse><ellipse cx="210" cy="434" rx="44" ry="10" fill="#F0C878" opacity=".85"></ellipse><ellipse cx="198" cy="430" rx="14" ry="4" fill="#fff" opacity=".25"></ellipse></g><g data-ms-part="glass"><path d="M96,208 C96,126 148,110 210,110 C272,110 324,126 324,208 L302,230 Q210,252 118,230 Z" fill="url(#ln-body-idle)" stroke="#726aa4" stroke-width="3"></path><path d="M118,208 Q210,170 302,208" fill="none" stroke="#fff" stroke-width="9" opacity=".12"></path><ellipse cx="210" cy="196" rx="80" ry="54" fill="url(#ln-screen-idle)" opacity=".55"></ellipse><path d="M190,246 L230,246 L222,422 L198,422 Z" fill="#726aa4"></path><path d="M196,246 L224,246 L218,422 L202,422 Z" fill="#9B8CDB"></path><ellipse cx="204" cy="280" rx="6" ry="42" fill="#fff" opacity=".12"></ellipse></g><g data-ms-part="flame"><ellipse cx="210" cy="232" rx="42" ry="30" fill="url(#ln-glow-idle)" opacity=".5"></ellipse><circle cx="210" cy="236" r="14" fill="#F0C878" opacity=".35"></circle></g><g data-ms-part="bands"><path d="M114,208 Q210,228 306,208" fill="none" stroke="#F0C878" stroke-width="6" stroke-linecap="round" opacity=".8"></path><ellipse cx="210" cy="316" rx="24" ry="11" fill="#F0C878"></ellipse><ellipse cx="204" cy="312" rx="8" ry="3" fill="#fff" opacity=".25"></ellipse></g><g data-ms-part="hang"><circle cx="210" cy="112" r="10" fill="#F0C878"></circle><circle cx="207" cy="109" r="2.8" fill="#fff" opacity=".65"></circle></g><g data-ms-part="accessory" transform="translate(320,160)"><path d="M0,-12 A14 14 0 1 0 0,12 A9 9 0 1 1 0,-12 Z" fill="#E8E0FF" stroke="#F0C878" stroke-width="2.5"></path></g><g data-ms-part="blush" fill="#f6af86" opacity=".4" transform="translate(0,0)"><ellipse cx="158" cy="214" rx="9" ry="5.5"></ellipse><ellipse cx="262" cy="214" rx="9" ry="5.5"></ellipse></g><g class="ln-pop ms-eyes" data-ms-part="eyes" transform="translate(0,-30)"><g data-ms-part="brows"></g><g transform="translate(0,0)"><g transform="translate(180,228)"><animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1 1;1 0.08;1 1;1 1" keyTimes="0;0.9;0.925;0.95;1" dur="5.4s" repeatCount="indefinite"></animateTransform><animateTransform attributeName="transform" type="scale" additive="sum" begin="ln-hit.click" dur="0.5s" fill="remove" values="1 1;1 0.1;1 1;1 0.1;1 1" keyTimes="0;0.2;0.45;0.7;1"></animateTransform><circle cx="0" cy="0" r="14" fill="#E8E0FF"></circle><g class="ln-pupils"><circle cx="-3.5" cy="-4" r="3.8" fill="#2A2440" opacity=".7